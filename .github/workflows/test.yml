name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    # 비공개 저장소의 macOS 러너는 분당 비용이 높아 최소 버전 하나만 돌린다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Shell syntax
        run: |
          for file in setup.sh bin/skim lib/python.sh; do
            bash -n "$file"
          done
      - name: Diag
        if: runner.os == 'macOS'
        continue-on-error: true
        run: python -m unittest -v tests.test_install_script
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -X faulthandler -c "import faulthandler,sys,unittest; faulthandler.dump_traceback_later(420, exit=True); sys.argv=['unittest','discover','-s','tests','-v']; unittest.main(module=None)"
